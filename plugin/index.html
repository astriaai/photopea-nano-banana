<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Astria for Photopea</title>
    <link rel="icon" href="./icon.jpeg" />
  </head>
  <body>
    <div id="boot-status" style="box-sizing:border-box;padding:16px;color:#b4b4b4;background:#161616;font:12px system-ui,sans-serif;">Loading Astria…</div>
    <div id="root"></div>
    <script>
      // A bundle that fails before React mounts must never leave a blank panel.
      window.addEventListener("error", function (event) {
        var status = document.getElementById("boot-status");
        if (status) status.textContent = "UI startup error: " + (event.message || "Unknown error");
      });
      window.addEventListener("unhandledrejection", function (event) {
        var status = document.getElementById("boot-status");
        var reason = event.reason && event.reason.message ? event.reason.message : String(event.reason || "Unknown error");
        if (status) status.textContent = "UI startup error: " + reason;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
